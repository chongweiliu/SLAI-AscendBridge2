[project]
name = "timm-mobilenetv3-small-100-lamb-in1k-ascend"
version = "0.1.0"
description = "Ascend NPU adaptation for timm/mobilenetv3_small_100.lamb_in1k (image classification)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "timm>=1.0.0",
    "pyyaml>=6.0",
    "huggingface_hub>=0.20",
    "safetensors>=0.4",
]

[project.optional-dependencies]
# 两路统一锁 torch==2.8.0：与 torch-npu==2.8.0.post4 ABI 匹配（本机验证组合）。
# torchvision 0.23.0 与 torch 2.8.0 配套；import timm 依赖 torchvision。
# 不要用 [tool.uv] conflicts 分桶 + torch>=：会让 --extra ascend 误装最新 torch 导致 ABI 崩坏。
cuda = ["torch==2.8.0", "torchvision==0.23.0"]
ascend = ["torch==2.8.0", "torchvision==0.23.0", "torch-npu==2.8.0.post4"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[[tool.uv.index]]
name = "ascend-repo"
url = "https://repo.huaweicloud.com/repository/pypi/simple"
explicit = true

[tool.uv.sources]
torch-npu = [{ index = "ascend-repo", extra = "ascend" }]
