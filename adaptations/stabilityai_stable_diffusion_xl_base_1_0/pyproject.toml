[project]
name = "stabilityai-sdxl-base-1-0-ascend"
version = "0.1.0"
description = "Ascend NPU adaptation for stabilityai/stable-diffusion-xl-base-1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "accelerate>=0.26.0",
    "transformers>=4.49.0,<5.0",
    "diffusers>=0.32.0",
    "safetensors>=0.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
cuda = ["torch>=2.6.0"]
# 本机 (Ascend910, CANN 25.5.5) 已验证可用的组合是 torch 2.8.0 + torch_npu 2.8.0.post4/5，
# 锁定 2.8.x 以避免更新版 torch_npu 与本机 CANN/驱动不兼容。
ascend = ["torch~=2.8.0", "torch-npu~=2.8.0"]

[tool.uv]
package = false
index-strategy = "unsafe-best-match"
conflicts = [[{ extra = "cuda" }, { extra = "ascend" }]]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "ascend-repo"
url = "https://repo.huaweicloud.com/repository/pypi/simple"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", extra = "cuda" },
    { index = "ascend-repo", extra = "ascend" },
]
torch-npu = [{ index = "ascend-repo", extra = "ascend" }]
