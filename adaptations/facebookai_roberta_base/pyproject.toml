[project]
name = "facebookai-roberta-base-ascend"
version = "0.1.0"
description = "Ascend NPU adaptation for FacebookAI/roberta-base (masked LM)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "accelerate>=0.26.0",
    "transformers>=4.45,<5.0",
    "safetensors>=0.4",
    # benchmark accuracy_run.py 需要 (R2)
    "datasets>=2.14",
    "numpy>=1.24",
]

[project.optional-dependencies]
# 两路统一锁 torch==2.8.0：与 torch-npu==2.8.0.post4 ABI 匹配（本机验证组合）。
# 不要用 [tool.uv] conflicts 分桶 + torch>=：会让 --extra ascend 误装最新 torch 导致 ABI 崩坏。
cuda = ["torch==2.8.0"]
ascend = ["torch==2.8.0", "torch-npu==2.8.0.post4"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[[tool.uv.index]]
name = "ascend-repo"
url = "https://repo.huaweicloud.com/repository/pypi/simple"
explicit = true

[tool.uv.sources]
torch-npu = [{ index = "ascend-repo", extra = "ascend" }]
