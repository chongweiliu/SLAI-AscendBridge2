[project]
name = "visionfm-ascend-adapter"
version = "0.1.0"
description = "VisionFM (ABILab-CUHK) ViT-B/16 fundus encoder - Ascend NPU adaptation"
requires-python = ">=3.10"

dependencies = [
    "pillow>=9.5.0",
    "numpy>=1.21.6",
    "einops>=0.6.1",
    "packaging>=23.0",
]

[project.optional-dependencies]
cuda = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
ascend = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "torch-npu>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["visionfm_src"]
