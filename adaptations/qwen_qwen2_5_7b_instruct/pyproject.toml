[project]
name = "qwen-qwen2-5-7b-instruct-ascend"
version = "0.1.0"
description = "Ascend NPU adaptation for Qwen/Qwen2.5-7B-Instruct"
requires-python = ">=3.10,<3.13"
dependencies = [
    "accelerate>=0.26.0",
    "transformers>=4.45,<5.0",
    "safetensors>=0.4",
    "tiktoken>=0.7",
    "datasets>=2.14",
    "numpy>=1.24",
]

[project.optional-dependencies]
cuda = ["torch>=2.6.0", "torchaudio>=2.6.0"]
ascend = ["torch==2.8.0", "torch-npu==2.8.0.post4"]

[tool.uv]
index-strategy = "unsafe-best-match"
conflicts = [[{ extra = "cuda" }, { extra = "ascend" }]]
python-install-mirror = "https://ghfast.top/github.com/astral-sh/python-build-standalone/releases/download"

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "ascend-repo"
url = "https://repo.huaweicloud.com/repository/pypi/simple"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", extra = "cuda" },
    { index = "ascend-repo", extra = "ascend" },
]
torchaudio = [{ index = "pytorch-cu124", extra = "cuda" }]
torch-npu = [{ index = "ascend-repo", extra = "ascend" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
