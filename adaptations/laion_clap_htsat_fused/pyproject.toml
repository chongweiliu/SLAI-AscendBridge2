[project]
name = "laion-clap-htsat-fused-ascend"
version = "0.1.0"
description = "Ascend NPU adaptation for laion/clap-htsat-fused (audio-text contrastive embeddings)"
requires-python = ">=3.10,<3.13"
# CLAP 音频特征 (mel 谱) 由 transformers.audio_utils 纯 numpy 实现，
# 无需 librosa / soundfile / torchaudio / scipy（本机 torchaudio 损坏，刻意不引入）。
dependencies = [
    "accelerate>=0.26.0",
    "transformers>=4.45,<5.0",
    "safetensors>=0.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
# 两路统一锁 torch==2.8.0：与 torch-npu==2.8.0.post4 ABI 匹配（本机验证组合）。
# 不要用 [tool.uv] conflicts 分桶 + torch>=：会让 --extra ascend 误装最新 torch，
# 与 torch-npu ABI 不匹配（此前已两次实测踩坑，且会产出自相矛盾的 uv.lock）。
cuda = ["torch==2.8.0"]
ascend = ["torch==2.8.0", "torch-npu==2.8.0.post4"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[[tool.uv.index]]
name = "ascend-repo"
url = "https://repo.huaweicloud.com/repository/pypi/simple"
explicit = true

[tool.uv.sources]
torch-npu = [{ index = "ascend-repo", extra = "ascend" }]
