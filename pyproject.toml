[project]
name = "slai-ascendbridge2"
version = "0.1.0"
description = "Framework for adapting and evaluating PyTorch models on Huawei Ascend NPUs"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.14.0",
    "huggingface-hub>=0.20.0",
    "hf-transfer>=0.1.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "requests>=2.31.0",
    "click>=8.1.0",
    "diffusers>=0.28.0",
    "gliner>=0.2.25",
    "matplotlib>=3.10.8",
    "python-docx>=1.2.0",
    "torch-npu[ascend]>=2.9.0",
    "rouge-score>=0.1.2",
    "jiwer>=4.0.0",
    "seqeval>=1.2.2",
    "accelerate>=1.13.0",
]

[tool.ruff]
exclude = [".history", ".venv", "__pycache__"]
line-length = 250

[tool.pyright]
exclude = [".history", ".venv"]
extraPaths = ["scripts"]

[tool.mypy]
exclude = ["\\.history", "\\.venv"]

[dependency-groups]
dev = ["pandoc>=2.4", "ruff>=0.15.0"]
